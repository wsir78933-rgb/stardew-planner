<div id="stardew-switch-preview">
  <style>
    #stardew-switch-preview .sp-stage { display: flex; justify-content: center; align-items: flex-start; min-height: 540px; padding: 24px 12px; box-sizing: border-box; }
    #stardew-switch-preview .sp-window { --sp-surface: light-dark(#f7faef, #1d271b); --sp-raised: light-dark(#f1f7e7, #283325); --sp-text: light-dark(#1c211b, #eaf0e1); --sp-dim: light-dark(#60685a, #b9c4b0); --sp-edge: light-dark(#31382d, #b3bea8); --sp-accent: light-dark(#9abd31, #a7c94a); --sp-dark-shadow: light-dark(rgba(36,42,34,.18), rgba(0,0,0,.34)); --sp-light-shadow: light-dark(rgba(255,255,255,.82), rgba(139,164,122,.12)); --sp-hover: light-dark(#e8efdb, #34432e); width: 328px; max-width: 100%; overflow: hidden; border: 1px solid light-dark(#dbe4ce, #485640); border-radius: 14px; background: var(--sp-surface); color: var(--sp-text); font-family: Arial, "PingFang SC", sans-serif; font-size: 13px; line-height: 1.4; box-shadow: 0 7px 22px light-dark(rgba(36,42,34,.10), rgba(0,0,0,.25)); }
    #stardew-switch-preview .sp-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--sp-edge); background: var(--sp-raised); }
    #stardew-switch-preview .sp-title { font-size: 14px; font-weight: 500; }
    #stardew-switch-preview .sp-close { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; color: var(--sp-dim); font-size: 20px; }
    #stardew-switch-preview .sp-content { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; }
    #stardew-switch-preview .sp-group { padding: 10px; border-radius: 10px; background: var(--sp-raised); }
    #stardew-switch-preview .sp-heading { color: var(--sp-dim); font-size: 12px; font-weight: 500; letter-spacing: .06em; margin-bottom: 10px; }
    #stardew-switch-preview .sp-row { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; box-sizing: border-box; padding: 5px 0; border: 0; border-radius: 6px; color: var(--sp-text); background: transparent; box-shadow: none; text-align: left; font: inherit; }
    #stardew-switch-preview .sp-row:hover:not(:disabled) { background: var(--sp-hover); }
    #stardew-switch-preview .sp-row:disabled { opacity: .5; cursor: not-allowed; }
    #stardew-switch-preview .sp-label { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    #stardew-switch-preview .sp-state { color: var(--sp-dim); font-size: 12px; }
    #stardew-switch-preview .sp-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 7px; }
    #stardew-switch-preview .sp-cyan { background: #08bde4; }
    #stardew-switch-preview .sp-orange { background: #ff591c; }
    #stardew-switch-preview .sp-yellow { background: #fbbb21; }
    #stardew-switch-preview .sp-green { background: #12d960; }
    #stardew-switch-preview .sp-track { flex: 0 0 34px; height: 20px; box-sizing: border-box; border: 1px solid var(--sp-edge); border-radius: 99px; padding: 1px; background: var(--sp-surface); box-shadow: inset 2.24px 2.56px 5.12px var(--sp-dark-shadow), inset -1.92px -2.24px 4.48px var(--sp-light-shadow); }
    #stardew-switch-preview .sp-thumb { display: block; height: 16px; width: 16px; box-sizing: border-box; border: 1px solid var(--sp-edge); border-radius: 50%; background: var(--sp-surface); }
    #stardew-switch-preview .sp-row[aria-pressed="true"] .sp-track { background: var(--sp-accent); }
    #stardew-switch-preview .sp-row[aria-pressed="true"] .sp-thumb { transform: translateX(13px); }
    #stardew-switch-preview .sp-current .sp-row { border: 1px solid transparent; background: var(--sp-raised); box-shadow: 2.56px 3.2px 6.72px var(--sp-dark-shadow), -2.24px -2.56px 5.76px var(--sp-light-shadow); }
    #stardew-switch-preview .sp-current .sp-row[aria-pressed="true"]:not(:disabled),
    #stardew-switch-preview .sp-current .sp-row:active:not(:disabled) { box-shadow: inset 2.24px 2.56px 5.12px var(--sp-dark-shadow), inset -1.92px -2.24px 4.48px var(--sp-light-shadow); }
    @media (max-width: 380px) { #stardew-switch-preview .sp-stage { padding: 18px 4px; } #stardew-switch-preview .sp-content { padding: 10px; } }
  </style>
  <div class="viz-carousel viz-dotted-background" aria-label="开关调整前后对比" data-previous-label="上一个效果" data-next-label="下一个效果">
    <section data-variant="拟调整效果" aria-label="拟调整后的开关面板">
      <div class="sp-stage">
        <div class="sp-window sp-proposed" aria-label="View 设置预览">
          <div class="sp-header"><span class="sp-title">View</span><span class="sp-close" aria-hidden="true">×</span></div>
          <div class="sp-content">
            <div class="sp-group"><div class="sp-heading">RANGES</div>
              <button class="sp-row cursor-interaction" type="button" aria-pressed="false" data-key="sprinkler"><span class="sp-dot sp-cyan" aria-hidden="true"></span><span class="sp-label">Sprinkler</span><span class="sp-state" aria-hidden="true">Off</span><span class="sp-track" aria-hidden="true"><span class="sp-thumb"></span></span></button>
              <button class="sp-row cursor-interaction" type="button" aria-pressed="false" data-key="scarecrow"><span class="sp-dot sp-orange" aria-hidden="true"></span><span class="sp-label">Scarecrow</span><span class="sp-state" aria-hidden="true">Off</span><span class="sp-track" aria-hidden="true"><span class="sp-thumb"></span></span></button>
              <button class="sp-row cursor-interaction" type="button" aria-pressed="false" data-key="bee"><span class="sp-dot sp-yellow" aria-hidden="true"></span><span class="sp-label">Bee house</span><span class="sp-state" aria-hidden="true">Off</span><span class="sp-track" aria-hidden="true"><span class="sp-thumb"></span></span></button>
              <button class="sp-row cursor-interaction" type="button" aria-pressed="true" data-key="junimo"><span class="sp-dot sp-green" aria-hidden="true"></span><span class="sp-label">Junimo hut</span><span class="sp-state" aria-hidden="true">On</span><span class="sp-track" aria-hidden="true"><span class="sp-thumb"></span></span></button>
            </div>
            <div class="sp-group"><div class="sp-heading">GUIDES</div>
              <button class="sp-row cursor-interaction" type="button" aria-pressed="false" data-key="grid"><span class="sp-label">Grid</span><span class="sp-state" aria-hidden="true">Off</span><span class="sp-track" aria-hidden="true"><span class="sp-thumb"></span></span></button>
              <button class="sp-row cursor-interaction" type="button" aria-pressed="false" data-key="resource"><span class="sp-label">Resource clumps</span><span class="sp-state" aria-hidden="true">Off</span><span class="sp-track" aria-hidden="true"><span class="sp-thumb"></span></span></button>
              <button class="sp-row" type="button" aria-pressed="false" disabled><span class="sp-label">NPC paths</span><span class="sp-state" aria-hidden="true">Off</span><span class="sp-track" aria-hidden="true"><span class="sp-thumb"></span></span></button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <section data-variant="当前效果" aria-label="当前整行带立体效果的开关面板" hidden>
      <div class="sp-stage">
        <div class="sp-window sp-current" aria-label="View 当前样式示意">
          <div class="sp-header"><span class="sp-title">View</span><span class="sp-close" aria-hidden="true">×</span></div>
          <div class="sp-content">
            <div class="sp-group"><div class="sp-heading">RANGES</div>
              <button class="sp-row cursor-interaction" type="button" aria-pressed="false" data-key="sprinkler"><span class="sp-dot sp-cyan" aria-hidden="true"></span><span class="sp-label">Sprinkler</span><span class="sp-state" aria-hidden="true">Off</span><span class="sp-track" aria-hidden="true"><span class="sp-thumb"></span></span></button>
              <button class="sp-row cursor-interaction" type="button" aria-pressed="false" data-key="scarecrow"><span class="sp-dot sp-orange" aria-hidden="true"></span><span class="sp-label">Scarecrow</span><span class="sp-state" aria-hidden="true">Off</span><span class="sp-track" aria-hidden="true"><span class="sp-thumb"></span></span></button>
              <button class="sp-row cursor-interaction" type="button" aria-pressed="false" data-key="bee"><span class="sp-dot sp-yellow" aria-hidden="true"></span><span class="sp-label">Bee house</span><span class="sp-state" aria-hidden="true">Off</span><span class="sp-track" aria-hidden="true"><span class="sp-thumb"></span></span></button>
              <button class="sp-row cursor-interaction" type="button" aria-pressed="true" data-key="junimo"><span class="sp-dot sp-green" aria-hidden="true"></span><span class="sp-label">Junimo hut</span><span class="sp-state" aria-hidden="true">On</span><span class="sp-track" aria-hidden="true"><span class="sp-thumb"></span></span></button>
            </div>
            <div class="sp-group"><div class="sp-heading">GUIDES</div>
              <button class="sp-row cursor-interaction" type="button" aria-pressed="false" data-key="grid"><span class="sp-label">Grid</span><span class="sp-state" aria-hidden="true">Off</span><span class="sp-track" aria-hidden="true"><span class="sp-thumb"></span></span></button>
              <button class="sp-row cursor-interaction" type="button" aria-pressed="false" data-key="resource"><span class="sp-label">Resource clumps</span><span class="sp-state" aria-hidden="true">Off</span><span class="sp-track" aria-hidden="true"><span class="sp-thumb"></span></span></button>
              <button class="sp-row" type="button" aria-pressed="false" disabled><span class="sp-label">NPC paths</span><span class="sp-state" aria-hidden="true">Off</span><span class="sp-track" aria-hidden="true"><span class="sp-thumb"></span></span></button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script>
    (() => {
      const root = document.getElementById("stardew-switch-preview");
      const defaults = { sprinkler: false, scarecrow: false, bee: false, junimo: true, grid: false, resource: false };
      let choices = { ...defaults };
      function restore(saved) {
        const previous = saved && saved.privateContent && saved.privateContent.switches;
        if (!previous || typeof previous !== "object") return;
        for (const key of Object.keys(defaults)) if (typeof previous[key] === "boolean") choices[key] = previous[key];
      }
      function render() {
        root.querySelectorAll("button[data-key]").forEach(button => {
          const enabled = choices[button.dataset.key];
          button.setAttribute("aria-pressed", String(enabled));
          button.querySelector(".sp-state").textContent = enabled ? "On" : "Off";
        });
      }
      restore(window.openai && window.openai.widgetState);
      render();
      root.querySelectorAll("button[data-key]").forEach(button => {
        button.addEventListener("click", () => {
          choices[button.dataset.key] = !choices[button.dataset.key];
          render();
          if (window.openai && window.openai.setWidgetState) window.openai.setWidgetState({ modelContent: { preview: "Stardew setting switches" }, privateContent: { switches: choices } }).catch(() => {});
        });
      });
      window.addEventListener("openai:set_globals", event => {
        if (event.detail && event.detail.globals && event.detail.globals.widgetState) { restore(event.detail.globals.widgetState); render(); }
      });
    })();
  </script>
</div>
