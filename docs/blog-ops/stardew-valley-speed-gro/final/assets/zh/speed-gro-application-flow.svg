<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1040" viewBox="0 0 390 1040" role="img" aria-labelledby="title desc">
  <title id="title">生长激素施用时机与作用范围流程图</title>
  <desc id="desc">在已锄地上，生长激素可在播种前、播种后或成长中施用，作用到首次成长和首次收获；已成熟等待再收获时，下一次再生长间隔不缩短。</desc>
  <defs>
    <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#476b62"/>
    </marker>
    <filter id="flowShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17352d" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="390" height="1040" fill="#fbfaf5"/>
  <rect x="8" y="8" width="374" height="1024" rx="22" fill="#fffdf8" stroke="#d9e4d7" stroke-width="3"/>

  <text x="24" y="48" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#1e3d33">生长激素（Speed-Gro）</text>
  <text x="24" y="78" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#1e3d33">施用时机与作用范围</text>
  <text x="24" y="108" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="15" fill="#5f7069">先确认地块，再判断影响哪一段时间</text>

  <g filter="url(#flowShadow)">
    <rect x="24" y="148" width="342" height="64" rx="16" fill="#dcefe3" stroke="#5b8d70" stroke-width="3"/>
    <text x="195" y="188" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#1e4c3a">已锄地</text>
  </g>
  <path d="M195 214 V240" stroke="#476b62" stroke-width="3" fill="none" marker-end="url(#flowArrow)"/>
  <text x="195" y="264" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#476b62">可在以下阶段施用</text>

  <path d="M42 286 V528" stroke="#9ab8a5" stroke-width="3" fill="none"/>
  <circle cx="42" cy="315" r="7" fill="#5b8d70"/>
  <circle cx="42" cy="395" r="7" fill="#5b8d70"/>
  <circle cx="42" cy="475" r="7" fill="#5b8d70"/>
  <g filter="url(#flowShadow)">
    <rect x="58" y="286" width="308" height="58" rx="14" fill="#f3ead2" stroke="#c79d53" stroke-width="2"/>
    <text x="212" y="322" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="18" font-weight="700" fill="#6a4b1d">播种前施用</text>
    <rect x="58" y="366" width="308" height="58" rx="14" fill="#f3ead2" stroke="#c79d53" stroke-width="2"/>
    <text x="212" y="402" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="18" font-weight="700" fill="#6a4b1d">播种后施用</text>
    <rect x="58" y="446" width="308" height="58" rx="14" fill="#f3ead2" stroke="#c79d53" stroke-width="2"/>
    <text x="212" y="482" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="18" font-weight="700" fill="#6a4b1d">成长中施用</text>
  </g>
  <path d="M42 528 H195 V548" stroke="#476b62" stroke-width="3" fill="none" marker-end="url(#flowArrow)"/>

  <g filter="url(#flowShadow)">
    <rect x="24" y="552" width="342" height="82" rx="16" fill="#e1edf4" stroke="#5d839a" stroke-width="3"/>
    <text x="195" y="588" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="19" font-weight="700" fill="#24485d">影响首次成长</text>
    <text x="195" y="616" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="19" font-weight="700" fill="#24485d">与首次收获</text>
  </g>

  <text x="24" y="682" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#793331">另一条判断：已成熟后等待再收获</text>
  <g filter="url(#flowShadow)">
    <rect x="24" y="700" width="342" height="64" rx="16" fill="#f7dddd" stroke="#b75a56" stroke-width="3"/>
    <text x="195" y="740" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="18" font-weight="700" fill="#793331">已成熟，等待再收获</text>
  </g>
  <path d="M195 766 V790" stroke="#9b4d4a" stroke-width="3" fill="none" marker-end="url(#flowArrow)"/>
  <g filter="url(#flowShadow)">
    <rect x="24" y="796" width="342" height="88" rx="16" fill="#f7dddd" stroke="#b75a56" stroke-width="3"/>
    <text x="195" y="833" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="19" font-weight="700" fill="#793331">再生长间隔不缩短</text>
    <text x="195" y="862" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="16" fill="#793331">例如草莓成熟后的 4 天仍按 4 天计算</text>
  </g>

  <g>
    <rect x="24" y="918" width="342" height="92" rx="14" fill="#edf1e7"/>
    <text x="42" y="946" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#385847">互斥限制：一格只能一种肥料</text>
    <text x="42" y="972" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14" fill="#385847">换季通常消失；多季作物、温室可保留</text>
    <text x="42" y="994" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14" fill="#385847">保留不等于再生长加速。</text>
  </g>
</svg>
