<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1160" viewBox="0 0 390 1160" role="img" aria-labelledby="title desc">
  <title id="title">Parsnip 与 Melon 各档位成长阶段和首次收获日期对照</title>
  <desc id="desc">每行都显示无肥料、生长激素、高级生长激素和顶级生长激素作用后的阶段日数向量与首次收获日期；示例是规则演算，不是游戏实测。</desc>
  <defs>
    <filter id="stageShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17352d" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="390" height="1160" fill="#fbfaf5"/>
  <rect x="8" y="8" width="374" height="1144" rx="22" fill="#fffdf8" stroke="#d9e4d7" stroke-width="3"/>

  <text x="24" y="44" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#1e3d33">成长阶段决定首次日期</text>
  <text x="24" y="72" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="15" fill="#5f7069">要移除阶段日 = 向上取整（基础成长天数 × 修正值）</text>
  <text x="24" y="98" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14" fill="#5f7069">按阶段顺序分配；每个数字就是修改后的阶段日数。</text>
  <text x="24" y="126" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14" fill="#5f7069">生长激素（Speed-Gro）、高级和顶级档位均列出。</text>

  <g filter="url(#stageShadow)">
    <rect x="18" y="154" width="354" height="410" rx="18" fill="#f1f6ed" stroke="#c4d9c1" stroke-width="2"/>
    <text x="32" y="190" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="19" font-weight="700" fill="#305640">Parsnip｜阶段 [1, 1, 1, 1]</text>
    <text x="32" y="216" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14" fill="#527064">基础 4 天；春季第 1 日播种，基准春季第 5 日收获</text>

    <g font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14" fill="#385847">
      <text x="30" y="262">无肥料 0%</text>
      <rect x="120" y="232" width="25" height="42" fill="#c8dfbd" stroke="#6e9871" stroke-width="1.5"/><rect x="145" y="232" width="25" height="42" fill="#c8dfbd" stroke="#6e9871" stroke-width="1.5"/><rect x="170" y="232" width="25" height="42" fill="#c8dfbd" stroke="#6e9871" stroke-width="1.5"/><rect x="195" y="232" width="25" height="42" fill="#c8dfbd" stroke="#6e9871" stroke-width="1.5"/>
      <text x="132.5" y="259" text-anchor="middle">1</text><text x="157.5" y="259" text-anchor="middle">1</text><text x="182.5" y="259" text-anchor="middle">1</text><text x="207.5" y="259" text-anchor="middle">1</text><text x="244" y="259">→ 春季第 5 日</text>

      <text x="30" y="327">生长激素 10%</text>
      <rect x="120" y="297" width="25" height="42" fill="#dcefe3" stroke="#5b8d70" stroke-width="1.5"/><rect x="145" y="297" width="25" height="42" fill="#f0dfd7" stroke="#b75a56" stroke-width="1.5"/><rect x="170" y="297" width="25" height="42" fill="#dcefe3" stroke="#5b8d70" stroke-width="1.5"/><rect x="195" y="297" width="25" height="42" fill="#dcefe3" stroke="#5b8d70" stroke-width="1.5"/>
      <text x="132.5" y="324" text-anchor="middle">1</text><text x="157.5" y="324" text-anchor="middle">0</text><text x="182.5" y="324" text-anchor="middle">1</text><text x="207.5" y="324" text-anchor="middle">1</text><text x="244" y="324">→ 春季第 4 日</text>

      <text x="30" y="392">高级 25%</text>
      <rect x="120" y="362" width="25" height="42" fill="#dcefe3" stroke="#5b8d70" stroke-width="1.5"/><rect x="145" y="362" width="25" height="42" fill="#f0dfd7" stroke="#b75a56" stroke-width="1.5"/><rect x="170" y="362" width="25" height="42" fill="#dcefe3" stroke="#5b8d70" stroke-width="1.5"/><rect x="195" y="362" width="25" height="42" fill="#dcefe3" stroke="#5b8d70" stroke-width="1.5"/>
      <text x="132.5" y="389" text-anchor="middle">1</text><text x="157.5" y="389" text-anchor="middle">0</text><text x="182.5" y="389" text-anchor="middle">1</text><text x="207.5" y="389" text-anchor="middle">1</text><text x="244" y="389">→ 春季第 4 日</text>

      <text x="30" y="457">顶级 33%</text>
      <rect x="120" y="427" width="25" height="42" fill="#dcefe3" stroke="#5b8d70" stroke-width="1.5"/><rect x="145" y="427" width="25" height="42" fill="#f0dfd7" stroke="#b75a56" stroke-width="1.5"/><rect x="170" y="427" width="25" height="42" fill="#f0dfd7" stroke="#b75a56" stroke-width="1.5"/><rect x="195" y="427" width="25" height="42" fill="#dcefe3" stroke="#5b8d70" stroke-width="1.5"/>
      <text x="132.5" y="454" text-anchor="middle">1</text><text x="157.5" y="454" text-anchor="middle">0</text><text x="182.5" y="454" text-anchor="middle">0</text><text x="207.5" y="454" text-anchor="middle">1</text><text x="244" y="454">→ 春季第 3 日</text>
    </g>
    <text x="32" y="532" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14" fill="#527064">相同阶段向量下，10% 与 25% 都只移除 1 天。</text>
  </g>

  <g filter="url(#stageShadow)">
    <rect x="18" y="584" width="354" height="544" rx="18" fill="#eef5f7" stroke="#bdd5dc" stroke-width="2"/>
    <text x="32" y="620" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="19" font-weight="700" fill="#2b5363">Melon｜阶段 [1, 2, 3, 3, 3]</text>
    <text x="32" y="646" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14" fill="#5b7480">基础 12 天；夏季第 1 日播种，基准夏季第 13 日收获</text>

    <g font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14" fill="#2b5363">
      <text x="30" y="692">无肥料 0%</text>
      <rect x="120" y="662" width="25" height="42" fill="#c5dfe4" stroke="#6592a1" stroke-width="1.5"/><rect x="145" y="662" width="25" height="42" fill="#b5d5dc" stroke="#6592a1" stroke-width="1.5"/><rect x="170" y="662" width="25" height="42" fill="#a6cbd5" stroke="#6592a1" stroke-width="1.5"/><rect x="195" y="662" width="25" height="42" fill="#98c3cf" stroke="#6592a1" stroke-width="1.5"/><rect x="220" y="662" width="25" height="42" fill="#8fbccc" stroke="#6592a1" stroke-width="1.5"/>
      <text x="132.5" y="689" text-anchor="middle">1</text><text x="157.5" y="689" text-anchor="middle">2</text><text x="182.5" y="689" text-anchor="middle">3</text><text x="207.5" y="689" text-anchor="middle">3</text><text x="232.5" y="689" text-anchor="middle">3</text><text x="258" y="689">→ 夏季第 13 日</text>

      <text x="30" y="757">生长激素 10%</text>
      <rect x="120" y="727" width="25" height="42" fill="#c5dfe4" stroke="#6592a1" stroke-width="1.5"/><rect x="145" y="727" width="25" height="42" fill="#b5d5dc" stroke="#6592a1" stroke-width="1.5"/><rect x="170" y="727" width="25" height="42" fill="#a6cbd5" stroke="#6592a1" stroke-width="1.5"/><rect x="195" y="727" width="25" height="42" fill="#98c3cf" stroke="#6592a1" stroke-width="1.5"/><rect x="220" y="727" width="25" height="42" fill="#8fbccc" stroke="#6592a1" stroke-width="1.5"/>
      <text x="132.5" y="754" text-anchor="middle">1</text><text x="157.5" y="754" text-anchor="middle">1</text><text x="182.5" y="754" text-anchor="middle">2</text><text x="207.5" y="754" text-anchor="middle">3</text><text x="232.5" y="754" text-anchor="middle">3</text><text x="258" y="754">→ 夏季第 11 日</text>

      <text x="30" y="822">高级 25%</text>
      <rect x="120" y="792" width="25" height="42" fill="#c5dfe4" stroke="#6592a1" stroke-width="1.5"/><rect x="145" y="792" width="25" height="42" fill="#b5d5dc" stroke="#6592a1" stroke-width="1.5"/><rect x="170" y="792" width="25" height="42" fill="#a6cbd5" stroke="#6592a1" stroke-width="1.5"/><rect x="195" y="792" width="25" height="42" fill="#98c3cf" stroke="#6592a1" stroke-width="1.5"/><rect x="220" y="792" width="25" height="42" fill="#8fbccc" stroke="#6592a1" stroke-width="1.5"/>
      <text x="132.5" y="819" text-anchor="middle">1</text><text x="157.5" y="819" text-anchor="middle">1</text><text x="182.5" y="819" text-anchor="middle">2</text><text x="207.5" y="819" text-anchor="middle">2</text><text x="232.5" y="819" text-anchor="middle">3</text><text x="258" y="819">→ 夏季第 10 日</text>

      <text x="30" y="887">顶级 33%</text>
      <rect x="120" y="857" width="25" height="42" fill="#c5dfe4" stroke="#6592a1" stroke-width="1.5"/><rect x="145" y="857" width="25" height="42" fill="#b5d5dc" stroke="#6592a1" stroke-width="1.5"/><rect x="170" y="857" width="25" height="42" fill="#a6cbd5" stroke="#6592a1" stroke-width="1.5"/><rect x="195" y="857" width="25" height="42" fill="#98c3cf" stroke="#6592a1" stroke-width="1.5"/><rect x="220" y="857" width="25" height="42" fill="#8fbccc" stroke="#6592a1" stroke-width="1.5"/>
      <text x="132.5" y="884" text-anchor="middle">1</text><text x="157.5" y="884" text-anchor="middle">1</text><text x="182.5" y="884" text-anchor="middle">2</text><text x="207.5" y="884" text-anchor="middle">2</text><text x="232.5" y="884" text-anchor="middle">2</text><text x="258" y="884">→ 夏季第 9 日</text>
    </g>
    <text x="32" y="952" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14" fill="#5b7480">阶段日数被逐格扣减，长阶段因此更容易显出档位差异。</text>
    <text x="32" y="1000" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14" fill="#6a4b1d">日期为公开阶段数据与固定 1.6 反编译</text>
    <text x="32" y="1024" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="14" fill="#6a4b1d">实现的规则演算，不是游戏内实测。</text>
  </g>
</svg>
