<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="coverTitle coverDesc">
  <title id="coverTitle">三档付款：升级1、升级2和升级3</title>
  <desc id="coverDesc">三档付款：升级1是10,000金、450木材和3天；升级2是65,000金、100硬木和3天；升级3是100,000金和3天。</desc>
  <style>
    .label-title { font-family: 'Arial Narrow', 'PingFang SC', 'Hiragino Sans GB', sans-serif; font-size: 88px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .label-cost { font-family: 'Arial Narrow', 'PingFang SC', 'Hiragino Sans GB', sans-serif; font-size: 84px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .label-days { font-family: 'Arial Narrow', 'PingFang SC', 'Hiragino Sans GB', sans-serif; font-size: 84px; font-weight: 700; fill: #93c5fd; text-anchor: middle; dominant-baseline: middle; }
  </style>
  <rect width="1672" height="941" fill="#0b1329"/>
  <rect x="24" y="24" width="1624" height="893" rx="28" fill="none" stroke="#1e293b" stroke-width="3"/>

  <!-- Stage 1 -->
  <g id="stage-upgrade-1">
    <rect x="56" y="80" width="480" height="781" rx="24" fill="#0f172a" stroke="#10b981" stroke-width="4"/>
    <rect x="76" y="110" width="440" height="120" rx="16" fill="#064e3b" stroke="#34d399" stroke-width="3"/>
    <text id="text-upgrade-1-title" class="label-title" x="296" y="170" fill="#34d399">升级1</text>
    <rect x="76" y="280" width="440" height="130" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text id="text-upgrade-1-gold" class="label-cost" x="296" y="345">10,000金</text>
    <rect x="76" y="460" width="440" height="130" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text id="text-upgrade-1-wood" class="label-cost" x="296" y="525">450木材</text>
    <rect x="76" y="640" width="440" height="130" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text id="text-upgrade-1-days" class="label-days" x="296" y="705">3天</text>
  </g>

  <!-- Stage 2 -->
  <g id="stage-upgrade-2">
    <rect x="576" y="80" width="520" height="781" rx="24" fill="#0f172a" stroke="#3b82f6" stroke-width="4"/>
    <rect x="596" y="110" width="480" height="120" rx="16" fill="#1e3a5f" stroke="#60a5fa" stroke-width="3"/>
    <text id="text-upgrade-2-title" class="label-title" x="836" y="170" fill="#60a5fa">升级2</text>
    <rect x="596" y="280" width="480" height="130" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text id="text-upgrade-2-gold" class="label-cost" x="836" y="345">65,000金</text>
    <rect x="596" y="460" width="480" height="130" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text id="text-upgrade-2-hardwood" class="label-cost" x="836" y="525">100硬木</text>
    <rect x="596" y="640" width="480" height="130" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text id="text-upgrade-2-days" class="label-days" x="836" y="705">3天</text>
  </g>

  <!-- Stage 3 -->
  <g id="stage-upgrade-3">
    <rect x="1136" y="80" width="480" height="781" rx="24" fill="#0f172a" stroke="#a855f7" stroke-width="4"/>
    <rect x="1156" y="110" width="440" height="120" rx="16" fill="#3b1d54" stroke="#c084fc" stroke-width="3"/>
    <text id="text-upgrade-3-title" class="label-title" x="1376" y="170" fill="#c084fc">升级3</text>
    <rect x="1156" y="330" width="440" height="150" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text id="text-upgrade-3-gold" class="label-cost" x="1376" y="405">100,000金</text>
    <rect x="1156" y="550" width="440" height="150" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text id="text-upgrade-3-days" class="label-days" x="1376" y="625">3天</text>
  </g>
</svg>
