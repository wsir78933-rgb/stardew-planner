<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>First product only</title>
    <link rel="stylesheet" href="./diagram.css" />
  </head>
  <body>
    <div class="board">
      <h1 class="title">First product only, on one harvest</h1>
      <p class="subtitle">Controlled diagram, not a harvest popup</p>
      <div class="rows">
        <div class="row">
          <div class="crop-name">Blueberry</div>
          <div class="product first">
            <div class="berries"><span class="berry"></span></div>
            <div class="mark xp yes">10 Farming XP</div>
          </div>
          <div class="subtitle">vs</div>
          <div class="product extra">
            <div class="berries">
              <span class="berry"></span><span class="berry"></span>
            </div>
            <div class="mark xp no">0 Farming XP</div>
          </div>
        </div>
        <div class="row">
          <div class="crop-name">Cranberry</div>
          <div class="product first">
            <div class="berries"><span class="berry cran"></span></div>
            <div class="mark xp yes">14 Farming XP</div>
          </div>
          <div class="subtitle">vs</div>
          <div class="product extra">
            <div class="berries"><span class="berry cran"></span></div>
            <div class="mark xp no">0 Farming XP</div>
          </div>
        </div>
        <div class="row">
          <div class="crop-name">Potato</div>
          <div class="product first">
            <div class="tuber"></div>
            <div class="mark xp yes">14 Farming XP</div>
          </div>
          <div class="subtitle">vs</div>
          <div class="product extra">
            <div class="tuber"></div>
            <div class="mark xp no">0 Farming XP</div>
          </div>
        </div>
      </div>
      <p class="note">
        Next harvest date still grants XP for blueberry and cranberry.
      </p>
    </div>
  </body>
</html>
