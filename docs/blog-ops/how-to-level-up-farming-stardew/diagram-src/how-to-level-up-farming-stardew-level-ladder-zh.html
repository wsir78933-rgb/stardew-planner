<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>耕种等级梯子</title>
    <link rel="stylesheet" href="./diagram.css" />
  </head>
  <body>
    <div class="board">
      <h1 class="title">耕种 1 到 10 级累计梯子</h1>
      <p class="subtitle">等级示意图，不是技能菜单截图</p>
      <div class="ladder">
        <div class="rung">
          <div class="level">1 级</div>
          <div class="total">100</div>
          <div class="unlock"></div>
        </div>
        <div class="rung gate">
          <div class="level">2 级</div>
          <div class="total">380</div>
          <div class="unlock">洒水器</div>
        </div>
        <div class="rung">
          <div class="level">3 级</div>
          <div class="total">770</div>
          <div class="unlock"></div>
        </div>
        <div class="rung gate">
          <div class="level">4 级</div>
          <div class="total">1300</div>
          <div class="unlock">罐头瓶</div>
        </div>
        <div class="rung top">
          <div class="level">5 级</div>
          <div class="total">2150</div>
          <div class="unlock">职业弹窗</div>
        </div>
        <div class="rung gate">
          <div class="level">6 级</div>
          <div class="total">3300</div>
          <div class="unlock">优质洒水器</div>
        </div>
        <div class="rung">
          <div class="level">7 级</div>
          <div class="total">4800</div>
          <div class="unlock"></div>
        </div>
        <div class="rung top">
          <div class="level">8 级</div>
          <div class="total">6900</div>
          <div class="unlock">小桶</div>
        </div>
        <div class="rung top">
          <div class="level">9 级</div>
          <div class="total">10000</div>
          <div class="unlock">种子生产器、铱制洒水器</div>
        </div>
        <div class="rung top">
          <div class="level">10 级</div>
          <div class="total">15000</div>
          <div class="unlock"></div>
        </div>
      </div>
    </div>
  </body>
</html>
