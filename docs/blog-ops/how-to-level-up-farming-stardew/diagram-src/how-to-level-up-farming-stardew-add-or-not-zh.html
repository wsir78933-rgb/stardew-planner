<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>加或不加</title>
    <link rel="stylesheet" href="./diagram.css" />
  </head>
  <body>
    <div class="board">
      <h1 class="title">哪些动作加耕种经验</h1>
      <p class="subtitle">动作对照示意图，不是游戏截图</p>
      <div class="columns two">
        <section class="panel grant">
          <h2>加</h2>
          <div class="cards">
            <div class="card"><div class="label">收获作物</div></div>
            <div class="card"><div class="label">爱抚动物</div></div>
            <div class="card"><div class="label">挤奶</div></div>
            <div class="card"><div class="label">剪羊毛</div></div>
            <div class="card">
              <div class="label">捡蛋 / 鸭毛 / 动物毛 / 兔子的脚</div>
            </div>
            <div class="card">
              <div class="label">读星露谷年历</div>
              <div class="xp yes">250</div>
            </div>
          </div>
        </section>
        <section class="panel deny">
          <h2>不加</h2>
          <div class="cards">
            <div class="card"><div class="label">锄地</div></div>
            <div class="card"><div class="label">浇水</div></div>
            <div class="card"><div class="label">把种子放进土里</div></div>
            <div class="card"><div class="label">砍树</div></div>
            <div class="card">
              <div class="label">捡松露</div>
              <div class="xp no">采集，没有耕种经验</div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
